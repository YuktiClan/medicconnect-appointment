server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fhir_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: passw0rd
  flyway:
    enabled: false
  eureka:
    client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
        defaultZone: http://localhost:8761/eureka/

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

hapi:
  fhir:
    fhir_version: R4
    allow_external_references: true
    allow_multiple_delete: true